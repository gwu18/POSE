classes:
- forward_head
- rounded_shoulders
- slouched
- perched_edge
- transient
good_tag: good
gate_class: transient
alert_zones:
  forward_head: neck
  rounded_shoulders: shoulders
  slouched: lower_back
  perched_edge: seat
paths:
  raw_dir: data/raw
  landmarks_dir: data/local_pair_landmarks
  labels_dir: data/local_pair_labels
  splits: data/local_pair_splits.json
  runs_dir: runs
  pose_model: models/pose_landmarker_full.task
data:
  fps: 15
  window: 45
  stride: 5
  label_tail: 15
  tail_purity: 0.8
  min_detected: 0.6
augment:
  enabled: true
  rotate_deg: 10
  x_squash:
  - 0.75
  - 1.1
  noise_std: 0.01
  time_stretch:
  - 0.8
  - 1.2
  vis_drop_prob: 0.05
model:
  type: tcn
  channels: 16
  levels: 3
  kernel_size: 3
  dropout: 0.2
  variant: gated
train:
  seed: 42
  batch_size: 32
  epochs: 12
  lr: 0.0003
  weight_decay: 0.0001
  pos_weight: true
  pos_weight_max: 10
  patience: 12
  num_workers: 0
alerts:
  prob_threshold: 0.6
  per_class_threshold: {}
  gate_threshold: 0.5
  persist_s: 5.0
  cooldown_s: 20.0
qa:
  good_max_rel_neck: 25
  good_max_abs_trunk: 20
  forward_head_min_rel_neck: 20
  rounded_shoulders_min_line: 0.03
  slouched_max_torso_ratio: 0.97
  slouched_max_trunk: -5
  perched_edge_min_thigh: 8
